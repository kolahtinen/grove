<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · grove</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/grove.css">
<script type="module" src="/assets/topbar.mjs"></script>
<script type="module" src="/assets/session.mjs"></script>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="gl" d="M3 27h26"/><g class="tr t1"><path d="M9 27V19M5 19l4-9 4 9z"/></g><g class="tr t2"><path d="M17 27V15M12 15l5-11 5 11z"/></g><g class="tr t3"><path d="M25 27v-6M22 21l3-7 3 7z"/></g></svg><span class="name"><span class="title">grove</span><span class="tagline">grow from what you know</span></span></a>
<div class="account" hidden><button type="button" class="bar-button menu-button" aria-label="Menu" aria-expanded="false" aria-controls="site-menu">☰</button></div>
</div>
</header>
<main>
<div class="session-top" id="session-top" hidden></div>
<section class="card" id="no-session" hidden>
<h2>No session going</h2>
<p>Start one from Home: Discover, Review or Mix.</p>
<p><a class="button-link main" href="/">Back to Home</a></p>
</section>
<section class="card" id="offer" hidden>
<p class="small muted" id="offer-label"></p>
<h2>Not enough new texts</h2>
<p id="offer-line"></p>
<div class="row" id="offer-choices"><a class="button-link main" id="offer-add" href="/add?from=session">Add a text</a><button type="button" id="offer-without">Practise without</button></div>
<p class="small muted" id="offer-note">Practise without goes on with what you have, filled with early reviews and texts again.</p>
<p class="small"><button type="button" class="link-button" id="offer-leave">Leave: back to Home</button></p>
</section>
<section class="card b-card" id="start-card" hidden></section>
<section class="card b-card" id="exercise" hidden>
<p class="ex-kicker-line" id="exercise-kicker"></p>
<h2 class="ex-task" id="exercise-task"></h2>
<p class="small muted ex-hint" id="exercise-hint" hidden></p>
<div class="ex-body" id="exercise-box"></div>
</section>
<section class="card b-card" id="session-end" hidden></section>
<p class="message" id="session-message" role="status" hidden></p>
<div class="action-bar" id="action-bar" hidden><div class="action-inner"><p class="fb" id="feedback" role="status" hidden></p><p class="wait" id="wait" hidden></p><div class="actions" id="actions"></div></div></div>
</main>
</body>
</html>
