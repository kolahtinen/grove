<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text · grove</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/grove.css">
<script type="module" src="/assets/reading.mjs"></script>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 27h26"/><path d="M9 27V19M5 19l4-9 4 9z"/><path d="M17 27V15M12 15l5-11 5 11z"/><path d="M25 27v-6M22 21l3-7 3 7z"/></svg><span class="name"><span class="title">grove</span><span class="tagline">grow from what you know</span></span></a>
<div class="account" hidden><a class="bar-button nav" href="/dictionary">Dictionary</a><span class="account-email"></span><button type="button" class="bar-button signout">Sign out</button></div>
</div>
</header>
<main>
<section class="card" id="reading-card">
<h2 id="title"></h2>
<p class="small muted" id="stats"></p>
<div class="row reading-tools">
<button type="button" id="toggle-en" aria-pressed="true">English: on</button>
<button type="button" class="main" id="practise">Practise</button>
</div>
<ol class="lines" id="lines"></ol>
</section>
<section class="card" id="practice-card" hidden>
<h2 id="practice-heading">Practise</h2>
<div id="practice"></div>
</section>
<section class="card" id="questions-card" hidden>
<h2>Questions</h2>
<div id="questions"></div>
</section>
<section class="card" id="rating-card">
<h2>How much did you understand?</h2>
<div class="ratings" id="ratings">
<button type="button" data-value="almost_nothing">Almost nothing</button>
<button type="button" data-value="a_little">A little</button>
<button type="button" data-value="about_half">About half</button>
<button type="button" data-value="most">Most</button>
<button type="button" data-value="everything">Everything</button>
</div>
<p class="message" id="rating-message" role="status" hidden></p>
<p><a href="/">Back to Home</a></p>
</section>
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-word" hidden>
<div class="sheet-head"><h3 id="menu-word"></h3><button type="button" class="bar-button" id="menu-close">Close</button></div>
<p id="menu-status" class="menu-status"></p>
<dl class="menu-facts">
<dt>Dictionary form</dt><dd id="menu-lemma"></dd>
<dt>Meaning here</dt><dd id="menu-meaning"></dd>
</dl>
<p id="menu-explanation" class="menu-explanation" hidden></p>
<div id="menu-phrases" hidden><h4 class="small">Part of</h4><ul id="menu-phrase-list"></ul></div>
<div id="menu-patterns" hidden><h4 class="small">Grammar pattern</h4><ul id="menu-pattern-list"></ul></div>
<div class="row">
<button type="button" id="menu-explain">Explain</button>
<button type="button" id="menu-save" hidden>Save as leaf</button>
<button type="button" id="menu-report-line">Report sentence</button>
</div>
<form id="explain-form" hidden>
<p class="small">Why do you want it explained?</p>
<div class="reasons" id="explain-reasons">
<label class="check"><input type="radio" name="reason" value="why_form" checked><span>Why this form</span></label>
<label class="check"><input type="radio" name="reason" value="why_here"><span>Why this word is here</span></label>
<label class="check"><input type="radio" name="reason" value="other_meaning"><span>A different meaning than I know</span></label>
<label class="check"><input type="radio" name="reason" value="reading"><span>Reading</span></label>
<label class="check"><input type="radio" name="reason" value="other"><span>Other</span></label>
</div>
<label>Note (optional)<input type="text" name="note" maxlength="200"></label>
<button type="submit" class="main">Ask for an explanation</button>
</form>
<form id="report-form" hidden>
<p class="small" id="report-what"></p>
<div class="reasons">
<label class="check"><input type="radio" name="reason" value="wrong_answer"><span>Wrong answer</span></label>
<label class="check"><input type="radio" name="reason" value="bad_translation"><span>Bad translation</span></label>
<label class="check"><input type="radio" name="reason" value="unnatural" checked><span>Unnatural sentence</span></label>
<label class="check"><input type="radio" name="reason" value="wrong_reading"><span>Wrong reading</span></label>
<label class="check"><input type="radio" name="reason" value="audio"><span>Audio</span></label>
<label class="check"><input type="radio" name="reason" value="other"><span>Other</span></label>
</div>
<label>Note (optional)<input type="text" name="note" maxlength="200"></label>
<button type="submit" class="main">Send report</button>
</form>
<p class="message" id="menu-message" role="status" hidden></p>
</section>
</main>
</body>
</html>
