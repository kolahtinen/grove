<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/grove.css">
<script type="module" src="/assets/topbar.mjs"></script>
<script type="module" src="/assets/dictionary.mjs"></script>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="gl" d="M3 27h26"/><g class="tr t1"><path d="M9 27V19M5 19l4-9 4 9z"/></g><g class="tr t2"><path d="M17 27V15M12 15l5-11 5 11z"/></g><g class="tr t3"><path d="M25 27v-6M22 21l3-7 3 7z"/></g></svg><span class="name"><span class="title">grove</span><span class="tagline">grow from what you know</span></span></a>
<div class="account" hidden><a class="bar-button nav" href="/dictionary">Dictionary</a><span class="account-email"></span><button type="button" class="bar-button signout">Sign out</button></div>
<a class="bar-button nav help-link" href="/how" aria-label="How grove works" title="How grove works">?</a>
</div>
</header>
<main>
<section class="card">
<h2>Dictionary</h2>
<p class="small muted">Every word, phrase, grammar pattern and name you have met.</p>
<label>Search<input type="text" id="search" autocomplete="off" maxlength="80"></label>
<div class="tab-list" role="tablist" aria-label="Kinds" id="dict-tabs">
<button type="button" role="tab" id="tab-words" data-tab="words" aria-controls="dict-panel" aria-selected="true">Words<span class="tag"></span></button>
<button type="button" role="tab" id="tab-phrases" data-tab="phrases" aria-controls="dict-panel" aria-selected="false">Phrases<span class="tag"></span></button>
<button type="button" role="tab" id="tab-patterns" data-tab="patterns" aria-controls="dict-panel" aria-selected="false">Grammar patterns<span class="tag"></span></button>
<button type="button" role="tab" id="tab-names" data-tab="names" aria-controls="dict-panel" aria-selected="false">Names<span class="tag"></span></button>
</div>
<div class="tab-panel" role="tabpanel" id="dict-panel" aria-labelledby="tab-words">
<p class="small muted" id="names-note" hidden>People and places in your texts. They never count as new words.</p>
<p class="small muted" id="count" aria-live="polite"></p>
<ul class="dict" id="dict-list"></ul>
<p class="message bad" id="dict-message" hidden></p>
<button type="button" id="more" hidden>More</button>
</div>
</section>
</main>
</body>
</html>
