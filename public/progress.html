<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress · grove</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/grove.css">
<script type="module" src="/assets/topbar.mjs"></script>
<script type="module" src="/assets/progress.mjs"></script>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="/"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="gl" d="M3 27h26"/><g class="tr t1"><path d="M9 27V19M5 19l4-9 4 9z"/></g><g class="tr t2"><path d="M17 27V15M12 15l5-11 5 11z"/></g><g class="tr t3"><path d="M25 27v-6M22 21l3-7 3 7z"/></g></svg><span class="name"><span class="title">grove</span><span class="tagline">grow from what you know</span></span></a>
<div class="account" hidden><button type="button" class="bar-button menu-button" aria-label="Menu" aria-expanded="false" aria-controls="site-menu">☰</button></div>
</div>
</header>
<main>
<div id="view-main">
<section class="card progress-head">
<div class="card-head"><h2>Progress</h2><span class="small muted" id="progress-today"></span></div>
<div class="levels" id="progress-levels"></div>
<p id="progress-level"></p>
<p class="small"><a href="#level" id="to-level">How your level is found ›</a></p>
</section>
<div class="stat-grid" id="progress-stats"></div>
<section class="card"><h2>Last 7 days, each day</h2><div id="week-chart"></div></section>
<section class="card"><h2>Since you started <span class="small muted" id="since-date"></span></h2><dl class="stat-rows" id="since"></dl></section>
</div>
<div id="view-days" hidden><section class="card"><h2>Last 7 days, day by day</h2><ul class="day-list" id="day-list"></ul></section></div>
<div id="view-words" hidden><section class="card">
<div class="switch-group" role="group" aria-label="Which words"><button type="button" id="tab-leaves" aria-pressed="true">Leaves</button><button type="button" id="tab-ground" aria-pressed="false">Ground</button></div>
<div id="words-body"></div></section></div>
<div id="view-level" hidden><section class="card"><h2>Your level</h2><div id="level-body"></div></section></div>
</main>

</body>
</html>
